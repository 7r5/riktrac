services:
  # Backend service built from this repo, using official Traccar image.
  - type: web
    name: traccar-backend
    runtime: docker
    repo: https://github.com/7r5/riktrac.git
    branch: master
    rootDir: backend
    dockerfilePath: ./Dockerfile
    region: oregon
    plan: free
    autoDeployTrigger: commit
    healthCheckPath: /api/health
    envVars:
      - key: CONFIG_USE_ENVIRONMENT_VARIABLES
        value: "true"
      # Skip protocol listeners on Render so the web/API server comes up quickly.
      - key: PROTOCOLS_ENABLE
        value: "none"
      - key: DATABASE_DRIVER
        value: org.postgresql.Driver
      # Render supplies a PostgreSQL connection string here.
      # The backend wrapper converts it to JDBC at startup.
      - key: DATABASE_USER
        fromDatabase:
          name: traccar-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: traccar-db
          property: password
      - key: DATABASE_NAME
        fromDatabase:
          name: traccar-db
          property: database
      # Convenience variable (not used directly by Traccar) to copy host:port.
      - key: POSTGRES_CONNECTION_STRING
        fromDatabase:
          name: traccar-db
          property: connectionString
      - key: WEB_ADDRESS
        value: 0.0.0.0
      - key: WEB_PORT
        value: "8082"
      - key: PORT
        value: "8082"

  # Frontend repo. Merge to master triggers deploy.
  - type: web
    name: traccar-web
    runtime: docker
    repo: https://github.com/7r5/traccar-web.git
    branch: master
    region: oregon
    plan: free
    autoDeployTrigger: commit
    healthCheckPath: /
    envVars:
      - key: PORT
        value: "80"

databases:
  - name: traccar-db
    plan: free
    region: oregon
    databaseName: traccar
    user: traccar
    ipAllowList: []
