previews:
  generation: automatic
  expireAfterDays: 7

services:
  # Backend service built from this repo, using official Traccar image.
  - type: web
    name: traccar-backend
    runtime: docker
    repo: https://github.com/7r5/riktrac.git
    branch: master
    dockerfilePath: ./backend/Dockerfile
    region: oregon
    plan: free
    autoDeployTrigger: commit
    healthCheckPath: /api/health
    envVars:
      - key: CONFIG_USE_ENVIRONMENT_VARIABLES
        value: "true"
      - key: DATABASE_DRIVER
        value: org.postgresql.Driver
      # Set this in Render dashboard as JDBC URL:
      # jdbc:postgresql://<host>:5432/<database>
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_USER
        fromDatabase:
          name: traccar-db
          property: user
      - key: DATABASE_PASSWORD
        fromDatabase:
          name: traccar-db
          property: password
      - key: DATABASE_NAME
        fromDatabase:
          name: traccar-db
          property: database
      # Convenience variable (not used directly by Traccar) to copy host:port.
      - key: POSTGRES_CONNECTION_STRING
        fromDatabase:
          name: traccar-db
          property: connectionString

  # Frontend repo. Merge to master triggers deploy.
  - type: web
    name: traccar-web
    runtime: docker
    repo: https://github.com/7r5/traccar-web.git
    branch: master
    region: oregon
    plan: free
    autoDeployTrigger: commit
    healthCheckPath: /
    envVars:
      - key: PORT
        value: "80"

databases:
  - name: traccar-db
    plan: free
    region: oregon
    databaseName: traccar
    user: traccar
    ipAllowList: []
